name: Ochtend Bot

on:
  schedule:
    - cron: '30 4 * * *' # Draait elke dag om 04:30 UTC (= 05:30 uur Nederlandse tijd)
  workflow_dispatch: # Maakt het ook mogelijk om de bot handmatig aan te zetten via de knop

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py

      - name: Commit and push generated HTML
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatische update van de ochtendbriefing"
          file_pattern: index.html
